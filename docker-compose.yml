services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: numa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - public-data:/app/public
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - numa-service
    networks:
      - numa-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: numa-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - numa-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Миграции БД - запускаются перед основным приложением
  numa-migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numa-migrations
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - numa-net
    command: sh -c "npx --no-install sequelize db:migrate"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: on-failure

  numa-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numa-app
    restart: always
    env_file: .env
    environment:
      - DOCKER_ENV=true
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
      - REDIS_URL=redis://redis-cache:6379
      - REDIS_QUEUE_URL=redis://redis-queue:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=768
    volumes:
      - public-data:/app/public
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      numa-migrations:
        condition: service_completed_successfully
    expose:
      - "5000"
    ports:
      - "5000:5000"
    networks:
      - numa-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  db:
    image: postgres:17-alpine
    container_name: numa-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_REPL_USER: ${DB_REPL_USER}
      DB_REPL_PASSWORD: ${DB_REPL_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./database/init-primary.sh:/docker-entrypoint-initdb.d/01-init-primary.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - numa-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    command: |
      postgres
      -c wal_level=replica
      -c hot_standby=on
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby_feedback=on
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c work_mem=16MB
      -c max_connections=100
      -c listen_addresses='*'

  db-replica:
    image: postgres:17-alpine
    container_name: numa-db-replica
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_REPL_USER: ${DB_REPL_USER}
      DB_REPL_PASSWORD: ${DB_REPL_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${DB_Replica_PORT}:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./database/init-replica.sh:/init-replica.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - numa-net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    entrypoint: [ "/bin/bash", "/init-replica.sh" ]

  redis-cache:
    image: redis:7.2-alpine
    container_name: numa-redis-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-cache-data:/data
    networks:
      - numa-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""

  redis-queue:
    image: redis:7.2-alpine
    container_name: numa-redis-queue
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis-queue-data:/data
    networks:
      - numa-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    command: redis-server --maxmemory 200mb --maxmemory-policy noeviction --appendonly yes

  grafana:
    image: grafana/grafana:10.2.2
    container_name: numa-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/config.ini:/etc/grafana/grafana.ini:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost/grafana
      - GF_SERVER_DOMAIN=api.numa.uz
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=warn
      - GF_METRICS_ENABLED=false
      - GF_EXPLORE_ENABLED=true
    depends_on:
      - loki
    networks:
      - numa-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:2.9.3
    container_name: numa-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - numa-net
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 400M
        reservations:
          cpus: '0.2'
          memory: 200M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:3.0.0
    container_name: numa-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - numa-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  postgres-primary-data:
  postgres-replica-data:
  redis-cache-data:
  redis-queue-data:
  grafana-data:
  loki-data:
  public-data:
  certbot_certs:
  certbot_webroot:

networks:
  numa-net:
    driver: bridge
