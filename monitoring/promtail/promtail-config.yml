server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # Node.js Application Logs (JSON structured via pino)
  - job_name: numa-app
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['numa-app']

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - replacement: 'numa-app'
        target_label: 'job'
      - replacement: 'production'
        target_label: 'environment'

    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            method: method
            url: url
            status: status
            duration: duration
            userId: userId
            requestId: requestId
      - labels:
          level:
          method:
          status:
      - timestamp:
          source: time
          format: RFC3339

  # PostgreSQL Logs
  - job_name: numa-db
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['numa-db']

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'numa-db'
        target_label: 'job'
      - replacement: 'production'
        target_label: 'environment'

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\S+)\s+\[(?P<pid>\d+)\]\s+(?P<level>\w+):\s+(?P<message>.*)$'
      - labels:
          level:
          pid:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05 MST'

  # Redis Cache Logs
  - job_name: numa-redis
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['numa-redis-cache']

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'numa-redis'
        target_label: 'job'
      - replacement: 'production'
        target_label: 'environment'

  # Nginx Access Logs
  - job_name: numa-nginx
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['numa-nginx']

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - replacement: 'numa-nginx'
        target_label: 'job'
      - replacement: 'production'
        target_label: 'environment'

    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+)\s+-\s+\S+\s+\[(?P<time>[^\]]+)\]\s+"(?P<method>\S+)\s+(?P<path>\S+)\s+\S+"\s+(?P<status>\d+)\s+(?P<bytes_sent>\d+).*$'
      - labels:
          method:
          status:

  # All other containers (fallback)
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_logging_jobname']
        target_label: 'job'
      - replacement: 'production'
        target_label: 'environment'
