openapi: 3.0.3
info:
  title: Numa E-Commerce API
  description: |
    REST API for Numa — multi-store e-commerce platform (nutrition, kids, halal).

    ## Authentication
    Admin endpoints require a **Bearer JWT token**.
    Obtain it via `POST /admin/login`, then set header: `Authorization: Bearer <token>`

    ## RBAC (Role-Based Access Control)
    - **super_admin**: Has all permissions and global access across all stores.
    - **admin**: Has only explicitly granted permissions and is scoped to a single assigned store.

    ## Store Scoping
    A regular admin can only access data for their assigned store.
    `super_admin` has global access (no store restriction).

    ## Cart
    Cart is **cookie-based** and **store-isolated**. No auth required.
    Each store has its own cart — cookies are named `cart_session_{store}`
    (e.g. `cart_session_nutrition`). The store is identified via the URL path.

    As an alternative to cookies, the cart session token can be passed via the
    `X-Cart-Token` request header.

    | Action | Endpoint |
    |--------|----------|
    | View cart | `GET /cart/{store}` |
    | Add item | `POST /cart/{store}/items` |
    | Update qty | `PATCH /cart/{store}/items/{productId}` |
    | Remove item | `DELETE /cart/{store}/items/{productId}` |
    | Clear cart | `DELETE /cart/{store}` |

    ## Stores
    Every product and category belongs to one of: `nutrition` | `kids` | `halal`

    ## Response format
    All responses follow:
    ```json
    { "success": true, "statusCode": 200, "message": "...", "data": { ... } }
    ```
  version: 1.0.0
  contact:
    name: Numa Backend

servers:
  - url: http://localhost:5000/api/v1
    description: Local development
  - url: https://api.numa.uz/api/v1
    description: Production

tags:
  - name: Auth
    description: Admin authentication
  - name: Admins
    description: Admin management (protected)
  - name: Categories
    description: Product categories
  - name: Products (Public)
    description: Public product endpoints
  - name: Products (CMS)
    description: Product management (protected)
  - name: Cart
    description: Shopping cart — cookie-based, store-isolated, no auth required
  - name: Orders (Public)
    description: Guest checkout
  - name: Orders (CMS)
    description: Order management (protected)
  - name: Payments
    description: Payment provider integrations (Click + Payme)
  - name: Health
    description: Service health check

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from POST /admin/login
    paymeBasicAuth:
      type: http
      scheme: basic
      description: Payme Basic Auth (username = cashier ID, password = key)

  schemas:
    # ── Primitives ──────────────────────────────────────────────────────────
    LocalizedText:
      type: object
      required: [uz, ru, en]
      properties:
        uz: { type: string, example: "Mahsulot" }
        ru: { type: string, example: "Продукт" }
        en: { type: string, example: "Product" }

    StoreSlug:
      type: string
      enum: [nutrition, kids, halal]

    # ── Wrappers ─────────────────────────────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        success:    { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message:    { type: string }
        data:       {}

    ErrorResponse:
      type: object
      properties:
        success:    { type: boolean, example: false }
        statusCode: { type: integer }
        code:       { type: string }
        message:    { type: string }
        requestId:  { type: string, format: uuid }

    # ── Admin ────────────────────────────────────────────────────────────────
    Admin:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string, example: "Test Admin" }
        email:       { type: string, format: email, example: "admin@numa.uz" }
        role:        { type: string, enum: [super_admin, admin] }
        isActive:    { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt:   { type: string, format: date-time }
        store:
          type: string
          nullable: true
          enum: [nutrition, kids, halal]
          description: Assigned store (null for super_admin — global access)
        permissions:
          type: array
          items:
            type: string
          description: List of granted permission keys

    AdminPermissionsList:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
          example: [products:read, products:write, products:delete, categories:read, categories:write, categories:delete, orders:read, orders:write, payments:read]

    # ── Category ─────────────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:            { type: string, format: uuid }
        name:          { $ref: '#/components/schemas/LocalizedText' }
        slug:          { type: string, example: "vitamins" }
        store:         { $ref: '#/components/schemas/StoreSlug' }
        parentId:      { type: string, format: uuid, nullable: true }
        imageUrl:      { type: string, nullable: true }
        sortOrder:     { type: integer, example: 0 }
        isActive:      { type: boolean }
        subcategories:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    # ── Product ──────────────────────────────────────────────────────────────
    ProductMedia:
      type: object
      properties:
        id:        { type: string, format: uuid }
        url:       { type: string }
        type:      { type: string, enum: [image, video] }
        isMain:    { type: boolean }
        sortOrder: { type: integer }

    Product:
      type: object
      properties:
        id:            { type: string, format: uuid }
        name:          { $ref: '#/components/schemas/LocalizedText' }
        description:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          nullable: true
        slug:          { type: string }
        sku:           { type: string, example: "NUM-NUT-001" }
        price:         { type: number, example: 85000 }
        discountPrice: { type: number, nullable: true, example: 72000 }
        stock:         { type: integer, example: 50 }
        unit:          { type: string, example: "шт" }
        store:         { $ref: '#/components/schemas/StoreSlug' }
        categoryId:    { type: string, format: uuid }
        status:        { type: string, enum: [active, draft, archived] }
        isFeatured:    { type: boolean }
        media:
          type: array
          items: { $ref: '#/components/schemas/ProductMedia' }
        category:      { $ref: '#/components/schemas/Category' }

    # ── Cart ─────────────────────────────────────────────────────────────────
    CartItem:
      type: object
      properties:
        id:          { type: string, format: uuid }
        productId:   { type: string, format: uuid }
        quantity:    { type: integer }
        isAvailable:
          type: boolean
          description: "false if product is deleted, archived, or out of stock"
        product:     { $ref: '#/components/schemas/Product' }

    Cart:
      type: object
      properties:
        id:           { type: string, format: uuid }
        sessionToken: { type: string }
        store:        { $ref: '#/components/schemas/StoreSlug' }
        expiresAt:    { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }

    # ── Order ────────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      properties:
        id:          { type: string, format: uuid }
        productId:   { type: string, format: uuid }
        productName: { $ref: '#/components/schemas/LocalizedText' }
        productSku:  { type: string }
        unitPrice:   { type: number }
        quantity:    { type: integer }
        subtotal:    { type: number }

    Order:
      type: object
      properties:
        id:              { type: string, format: uuid }
        store:           { $ref: '#/components/schemas/StoreSlug' }
        customerName:    { type: string }
        customerSurname: { type: string }
        customerPhone:   { type: string, example: "+998901234567" }
        customerAddress: { type: string }
        notes:           { type: string, nullable: true }
        status:          { type: string, enum: [new, processing, completed, cancelled] }
        paymentStatus:   { type: string, enum: [unpaid, pending, paid, failed, refunded], example: unpaid }
        paymentMethod:   { type: string, enum: [cash, click, payme], nullable: true }
        totalAmount:     { type: number, example: 157000 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        payments:
          type: array
          description: Payment attempts for this order (latest = most recent). Included in detail view only.
          items: { $ref: '#/components/schemas/PaymentTransaction' }
        createdAt: { type: string, format: date-time }

    # ── Pagination wrapper ───────────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }
        pages: { type: integer }

    # ── Blog ─────────────────────────────────────────────────────────────────
    MultilingualText:
      type: object
      properties:
        uz: { type: string }
        ru: { type: string }
        en: { type: string }
      required: [uz, ru, en]

    BlogPost:
      type: object
      properties:
        id:              { type: string, format: uuid }
        title:           { $ref: '#/components/schemas/MultilingualText' }
        excerpt:         { nullable: true, allOf: [{ $ref: '#/components/schemas/MultilingualText' }] }
        slug:            { type: string, example: protein-and-muscle }
        coverImageUrl:   { type: string, format: uri, nullable: true }
        store:           { type: string, enum: [nutrition, kids, halal], nullable: true }
        distributeTo:    { type: array, items: { type: string } }
        status:          { type: string, enum: [draft, published, archived] }
        publishedAt:     { type: string, format: date-time, nullable: true }
        tags:            { type: array, items: { type: string } }
        readTimeMinutes: { type: integer, nullable: true }
        viewCount:       { type: integer }
        createdAt:       { type: string, format: date-time }

    BlogPostDetail:
      allOf:
        - { $ref: '#/components/schemas/BlogPost' }
        - type: object
          properties:
            content:        { $ref: '#/components/schemas/MultilingualText' }
            seoTitle:       { nullable: true, allOf: [{ $ref: '#/components/schemas/MultilingualText' }] }
            seoDescription: { nullable: true, allOf: [{ $ref: '#/components/schemas/MultilingualText' }] }
            seoKeywords:    { type: array, items: { type: string } }
            products:
              type: array
              items: { $ref: '#/components/schemas/BlogProductCard' }

    BlogProductCard:
      type: object
      properties:
        blogPostId: { type: string, format: uuid }
        productId:  { type: string, format: uuid }
        note:       { type: string, nullable: true, example: Helps boost recovery }
        sortOrder:  { type: integer }
        product:
          type: object
          properties:
            id:            { type: string, format: uuid }
            name:          { $ref: '#/components/schemas/MultilingualText' }
            price:         { type: number, example: 45000 }
            discountPrice: { type: number, nullable: true }
            store:         { type: string }

    ClickResponse:
      type: object
      properties:
        click_trans_id:      { type: integer }
        merchant_trans_id:   { type: string }
        merchant_confirm_id: { type: string, nullable: true }
        error:               { type: integer }
        error_note:          { type: string }

    PaymentTransaction:
      type: object
      properties:
        id:                    { type: string, format: uuid }
        orderId:               { type: string, format: uuid }
        store:                 { type: string, enum: [nutrition, kids, halal] }
        provider:              { type: string, enum: [click, payme] }
        amountTiyin:           { type: integer }
        status:                { type: string, enum: [pending, paid, failed, cancelled, expired, refunded] }
        providerTransactionId: { type: string, nullable: true }
        paidAt:                { type: string, format: date-time, nullable: true }
        expiresAt:             { type: string, format: date-time, nullable: true }
        createdAt:             { type: string, format: date-time }
        order:
          type: object
          nullable: true
          properties:
            id:            { type: string, format: uuid }
            customerName:  { type: string }
            customerPhone: { type: string }
            totalAmount:   { type: number }
            status:        { type: string }
            store:         { type: string }

  # ── Reusable responses ─────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, statusCode: 401, code: UNAUTHORIZED, message: "Authentication required" }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, statusCode: 403, code: FORBIDDEN, message: "Access denied" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Bad request / validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource already exists or state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, statusCode: 409, code: CONFLICT, message: "Already exists" }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, statusCode: 422, code: VALIDATION_ERROR, message: "Validation failed" }

# ════════════════════════════════════════════════════════════════════════════
# PATHS
# ════════════════════════════════════════════════════════════════════════════
paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Service health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              example:
                status: healthy
                uptime: 3600
                dependencies:
                  database: { status: connected }
                  redis:    { status: connected }

  # ── Auth ────────────────────────────────────────────────────────────────────
  /admin/login:
    post:
      tags: [Auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email, example: "admin@numa.uz" }
                password: { type: string, example: "Admin123!" }
      responses:
        '200':
          description: Login successful — returns JWT token
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          admin: { $ref: '#/components/schemas/Admin' }
              example:
                success: true
                statusCode: 200
                message: "Login successful"
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  admin: { id: "uuid", name: "Test Admin", email: "admin@numa.uz", role: super_admin, isActive: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ── Admin management ─────────────────────────────────────────────────────────
  /admin:
    get:
      tags: [Admins]
      summary: List all admins (super_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: store
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StoreSlug' }
          description: Filter by store
      responses:
        '200':
          description: List of admins
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Admins]
      summary: Create new admin (super_admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:     { type: string, minLength: 2, maxLength: 100, example: "New Admin" }
                email:    { type: string, format: email, example: "new@numa.uz" }
                password: { type: string, minLength: 8, example: "SecurePass1!" }
                storeSlug:
                  allOf: [{ $ref: '#/components/schemas/StoreSlug' }]
                  nullable: true
                  description: Assigned store for the new admin (null = global access)
                permissions:
                  type: array
                  items: { type: string }
                  description: List of permission keys to grant
                  example: [products:read, products:write, orders:read]
      responses:
        '201':
          description: Admin created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/me:
    get:
      tags: [Admins]
      summary: Get own profile (any authenticated admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Admin profile
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    patch:
      tags: [Admins]
      summary: Update own name/email
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:  { type: string, minLength: 2, maxLength: 100, example: "Updated Name" }
                email: { type: string, format: email, example: "updated@numa.uz" }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/me/password:
    patch:
      tags: [Admins]
      summary: Change own password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, example: "OldPass123!" }
                newPassword:     { type: string, minLength: 8, example: "NewPass456!" }
      responses:
        '200': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/permissions:
    get:
      tags: [Admins]
      summary: List all available permission keys (super_admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Available permissions
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminPermissionsList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/{id}:
    get:
      tags: [Admins]
      summary: Get admin by ID (super_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Admin detail
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Admins]
      summary: Update admin name/email/isActive (super_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:     { type: string, minLength: 2, maxLength: 100 }
                email:    { type: string, format: email }
                isActive: { type: boolean }
      responses:
        '200':
          description: Admin updated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [Admins]
      summary: Delete admin (super_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Admin deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/{id}/permissions:
    patch:
      tags: [Admins]
      summary: Update admin store + permissions (super_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storeSlug:
                  allOf: [{ $ref: '#/components/schemas/StoreSlug' }]
                  nullable: true
                  description: Assigned store (null = global access)
                permissions:
                  type: array
                  items: { type: string }
                  description: Full replacement list of permission keys
                  example: [products:read, products:write, orders:read, orders:write]
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/{id}/password:
    patch:
      tags: [Admins]
      summary: Change any admin's password (super_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 8, example: "NewPass456!" }
      responses:
        '200': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/{id}/activate:
    post:
      tags: [Admins]
      summary: Activate admin (super_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Admin activated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/{id}/deactivate:
    post:
      tags: [Admins]
      summary: Deactivate admin (super_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
