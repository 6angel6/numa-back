        '204':
          description: Удалено

  # ═══════════════════════════════════════════════════════════════════════════
  # 🥗 FOODTECH: CMS SLOTS
  # ═══════════════════════════════════════════════════════════════════════════

  /nutrition/cms/slots:
    get:
      tags: ["🥗 FoodTech: CMS Slots"]
      summary: Список слотов доставки
      security: [{ bearerAuth: [] }]
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Список

    post:
      tags: ["🥗 FoodTech: CMS Slots"]
      summary: Создать слот
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryDate, timeStart, timeEnd]
              properties:
                deliveryDate: { type: string, format: date }
                timeStart: { type: string, example: "10:00" }
                timeEnd: { type: string, example: "14:00" }
                label: { $ref: "#/components/schemas/LocalizedText" }
                maxOrders: { type: integer, default: 50 }
                cutoffHours: { type: integer, default: 24 }
                minOrderTiyin: { type: integer, default: 0 }
                deliveryFeeTiyin: { type: integer, default: 0 }
      responses:
        '201':
          description: Создано

  /nutrition/cms/slots/generate:
    post:
      tags: ["🥗 FoodTech: CMS Slots"]
      summary: Генерация слотов на диапазон дат
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate, timeSlots]
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                timeSlots:
                  type: array
                  items:
                    type: object
                    properties:
                      timeStart: { type: string, example: "10:00" }
                      timeEnd: { type: string, example: "14:00" }
                      label: { $ref: "#/components/schemas/LocalizedText" }
                maxOrders: { type: integer, default: 50 }
                cutoffHours: { type: integer, default: 24 }
                deliveryFeeTiyin: { type: integer, default: 0 }
                minOrderTiyin: { type: integer, default: 0 }
            example:
              startDate: "2026-03-20"
              endDate: "2026-03-27"
              timeSlots:
                - { timeStart: "10:00", timeEnd: "14:00" }
                - { timeStart: "14:00", timeEnd: "18:00" }
                - { timeStart: "18:00", timeEnd: "22:00" }
              maxOrders: 50
              cutoffHours: 24
      responses:
        '200':
          description: Слоты созданы

  /nutrition/cms/slots/{id}:
    put:
      tags: ["🥗 FoodTech: CMS Slots"]
      summary: Обновить слот
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Обновлено

    delete:
      tags: ["🥗 FoodTech: CMS Slots"]
      summary: Удалить слот
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Удалено

