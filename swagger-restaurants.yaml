          application/json:
            schema:
              type: object
              required: [name, category, priceTiyin]
              properties:
                name: { $ref: "#/components/schemas/LocalizedText" }
                description: { $ref: "#/components/schemas/LocalizedText" }
                imageUrl: { type: string }
                category: { type: string, enum: [drink, snack, dessert, supplement, other] }
                calories: { type: integer }
                proteins: { type: number }
                fats: { type: number }
                carbs: { type: number }
                priceTiyin: { type: integer }
                maxPerDay: { type: integer }
      responses:
        '201':
          description: Создано

  /nutrition/cms/addons/{id}:
    put:
      tags: ["🥗 FoodTech: CMS Addons"]
      summary: Обновить добавку
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Обновлено

    delete:
      tags: ["🥗 FoodTech: CMS Addons"]
      summary: Удалить добавку
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Удалено

  # ═══════════════════════════════════════════════════════════════════════════
  # 🥗 FOODTECH: CMS TAGS
  # ═══════════════════════════════════════════════════════════════════════════

  /nutrition/cms/tags:
    get:
      tags: ["🥗 FoodTech: CMS Tags"]
      summary: Список тегов/аллергенов
      security: [{ bearerAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [allergen, dietary, category] }
      responses:
        '200':
          description: Список

    post:
      tags: ["🥗 FoodTech: CMS Tags"]
      summary: Создать тег
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, type]
              properties:
                slug: { type: string, example: "shellfish" }
                name: { $ref: "#/components/schemas/LocalizedText" }
                type: { type: string, enum: [allergen, dietary, category] }
                icon: { type: string }
                sortOrder: { type: integer }
      responses:
        '201':
          description: Создано

  /nutrition/cms/tags/{id}:
    put:
      tags: ["🥗 FoodTech: CMS Tags"]
